user @APP_USER@;
worker_processes 1;
pid /run/trading-partner-web.pid;
error_log @APP_ROOT@/data/nginx-error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log @APP_ROOT@/data/nginx-access.log;
    client_body_temp_path @APP_ROOT@/data/nginx-body;
    proxy_temp_path @APP_ROOT@/data/nginx-proxy;
    server {
        listen 80;
        server_name joakly.site;
        return 301 https://joakly.site$request_uri;
    }
    server {
        listen 443 ssl;
        server_name joakly.site;
        ssl_certificate @APP_ROOT@/config/tls/joakly.site_bundle.crt;
        ssl_certificate_key @APP_ROOT@/config/tls/joakly.site.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 21m;
        client_body_timeout 120s;
        location / {
            proxy_pass http://127.0.0.1:8097;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
